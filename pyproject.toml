[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "davinci-presentations-creator"
version = "0.1.0"
description = "Portable Hebrew presentations and interactive video for Da Vinci 4744"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.4,<13",
  "numpy>=1.26,<3",
  "python-bidi>=0.6.6,<0.7",
  "python-pptx>=1.0.2,<2",
  "imageio-ffmpeg==0.6.0",
]

[project.scripts]
davinci = "davinci_creator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
davinci_creator = ["player.html", "learning_bridge.js", "scorm.html", "scorm_runtime.js", "scorm_player.js"]
