name: Learning library

on:
    push:
        branches: [master, main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: learning-library-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            WRANGLER_SEND_METRICS: "false"
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
            - uses: actions/setup-node@v6
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: |
                      learning-library/package-lock.json
                      learning-library/cloudflare/package-lock.json
            - name: Install content tools
              run: |
                  python -m venv .venv
                  .venv/bin/python -m pip install -e .
            - name: Check content tools and packaging
              run: .venv/bin/python -m unittest discover -s tests
            - name: Install website
              run: npm --prefix learning-library ci --no-audit --no-fund
            - name: Check website
              run: |
                  npm --prefix learning-library run typecheck
                  npm --prefix learning-library run format:check
                  npm --prefix learning-library test
            - name: Build website for the service origin
              env:
                  EXPO_BASE_URL: ""
              run: npm --prefix learning-library run build
            - name: Install Cloudflare tools
              run: npm --prefix learning-library/cloudflare ci --no-audit --no-fund
            - name: Stage application assets
              run: npm --prefix learning-library/cloudflare run prepare:content
            - name: Check Worker and deployment bundle
              run: |
                  npm --prefix learning-library/cloudflare run typecheck
                  npm --prefix learning-library/cloudflare run format:check
                  npm --prefix learning-library/cloudflare test
                  npm --prefix learning-library/cloudflare run check:deploy
            - name: Save verified deployment inputs
              if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
              uses: actions/upload-artifact@v4
              with:
                  name: cloudflare-library
                  path: |
                      learning-library/output/cloudflare-assets
                  if-no-files-found: error
                  retention-days: 1

    deploy:
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        needs: check
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment:
            name: production
            url: https://knowledge.davinci4744.com
        defaults:
            run:
                working-directory: learning-library/cloudflare
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            WRANGLER_SEND_METRICS: "false"
        steps:
            - uses: actions/checkout@v6
            - name: Check deployment credential
              run: |
                  if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
                      echo "::error::Add the CLOUDFLARE_API_TOKEN Actions secret to enable Cloudflare deployments."
                      exit 1
                  fi
            - uses: actions/setup-node@v6
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: learning-library/cloudflare/package-lock.json
            - name: Install pinned Cloudflare tools
              run: npm ci --no-audit --no-fund
            - uses: actions/download-artifact@v4
              with:
                  name: cloudflare-library
                  path: learning-library/output/cloudflare-assets
            - name: Deploy verified library to Cloudflare
              run: node_modules/.bin/wrangler deploy
            - name: Deploy retired-domain redirect
              run: node_modules/.bin/wrangler deploy --config wrangler.redirect.jsonc
            - name: Verify public site and retired integrations
              run: |
                  curl --fail --silent --show-error --retry 5 --retry-delay 3 https://knowledge.davinci4744.com/ -o /dev/null
                  curl --fail --silent --show-error --retry 5 --retry-delay 3 https://knowledge.davinci4744.com/health |
                      python3 -c 'import json,sys; status=json.load(sys.stdin); assert status=={"status":"ok"}, "Library health check failed"'
                  curl --fail --silent --show-error --retry 5 --retry-delay 3 https://knowledge.davinci4744.com/library/catalog.json |
                      python3 -c 'import json,sys; assert isinstance(json.load(sys.stdin), list), "R2 catalog is unavailable"'
                  integration_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://knowledge.davinci4744.com/lti/jwks)
                  test "$integration_status" = "410"
                  retired_status=$(curl --silent --show-error --retry 5 --retry-delay 3 --output /dev/null --write-out '%{http_code}' https://learn.davinci4744.com/lti/jwks)
                  test "$retired_status" = "410"
