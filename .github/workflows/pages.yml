name: Learning library

on:
    push:
        branches: [master, main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: read
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
            - uses: actions/setup-node@v6
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: projects/learning-library/package-lock.json
            - name: Install local render tools
              run: pip install -e '.[lti]'
            - name: Verify gallery packaging
              run: python -m unittest discover -s tests
            - name: Install website
              working-directory: projects/learning-library
              run: npm ci --no-audit --no-fund
            - name: Check website
              working-directory: projects/learning-library
              run: |
                  npm run typecheck
                  npm test
            - name: Configure Pages
              if: github.event_name != 'pull_request'
              id: pages
              uses: actions/configure-pages@v5
            - name: Export static website
              working-directory: projects/learning-library
              env:
                  # configure-pages handles custom domains and user/organization sites too.
                  EXPO_BASE_URL: ${{ steps.pages.outputs.base_path }}
              run: npm run build
            - name: Upload Pages artifact
              if: github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@v4
              with:
                  path: projects/learning-library/output/site

    deploy:
        if: github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
