if(!out.children.length){const p=document.createElement('p');p.textContent='לא נמצאו תוצאות';out.append(p)}
}transcript();
function checkpoint(scene){
seen.add(scene.id);video.pause();const q=scene.quiz;document.querySelector('#question').textContent=q.question;document.querySelector('#feedback').textContent='';document.querySelector('#resume').textContent='להמשיך בלי לענות';
const options=document.querySelector('#options');options.replaceChildren();q.options.forEach((o,i)=>options.append(button(o,()=>{const correct=i===q.correct;document.querySelector('#feedback').textContent=(correct?'נכון! ':'נסו שוב. ')+(q.explanation||'');if(correct)document.querySelector('#resume').textContent='ממשיכים'})));
quiz.showModal();
}
document.querySelector('#resume').onclick=()=>{quiz.close();video.play().catch(()=>{})};
document.querySelector('#reviewQuestion').onclick=()=>{const s=data.scenes[sceneIndex(video.currentTime)];if(s?.quiz)checkpoint(s)};
document.querySelector('#speed').onchange=e=>video.playbackRate=Number(e.target.value);
document.querySelector('#search').oninput=e=>transcript(e.target.value);
document.querySelector('#restart').onclick=()=>{seen.clear();jump(0);video.play().catch(()=>{})};
video.addEventListener('loadedmetadata',()=>{try{const t=Number(localStorage.getItem(storageKey)||0);if(t>0&&t<video.duration-2)jump(t)}catch{}});
video.addEventListener('seeking',()=>lastTime=video.currentTime);
video.addEventListener('timeupdate',()=>{
const t=video.currentTime,index=sceneIndex(t);
document.querySelectorAll('#chapters button').forEach((b,i)=>{b.classList.toggle('active',i===index);if(i===index)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')});
document.querySelector('#reviewQuestion').disabled=!data.scenes[index]?.quiz;
if(Math.abs(t-lastSaved)>2){try{localStorage.setItem(storageKey,String(t))}catch{}lastSaved=t}
if(document.querySelector('#checkpoints').checked&&!quiz.open&&t-lastTime<1.5){const crossed=data.scenes.find(s=>s.quiz&&!seen.has(s.id)&&s.start+s.duration-.15>lastTime&&s.start+s.duration-.15<=t);if(crossed)checkpoint(crossed)}lastTime=t;
});
addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON','TEXTAREA','VIDEO'].includes(e.target.tagName)||quiz.open)return;if(e.code==='Space'){e.preventDefault();video.paused?video.play().catch(()=>{}):video.pause()}if(e.key==='ArrowRight')jump(Math.min(video.duration||0,video.currentTime+5));if(e.key==='ArrowLeft')jump(Math.max(0,video.currentTime-5))});
</script>
</html>
