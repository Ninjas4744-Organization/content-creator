<script>
const data=JSON.parse(document.querySelector('#content').textContent),video=document.querySelector('#video');
const quiz=document.querySelector('#quiz'),seen=new Set();let lastTime=0,lastSaved=0;
const storageKey='davinci-video:'+data.title+':'+data.scenes.map(s=>s.id+':'+s.duration).join('|');
const format=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
// Video clocks round to microseconds; allow half a frame at chapter boundaries.
const sceneIndex=t=>{const i=data.scenes.findIndex(s=>t+.02>=s.start&&t+.02<s.start+s.duration);return i<0?data.scenes.length-1:i};
function jump(t){if(video.readyState<1){video.addEventListener('loadedmetadata',()=>jump(t),{once:true});return}video.currentTime=t;lastTime=t;document.querySelector('#status').textContent='מעבר לפרק '+format(t)}
function button(text,action){const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=action;return b}
data.scenes.forEach((s,i)=>{const b=button(`${format(s.start)} · ${s.chapter||s.title}`,()=>jump(s.start));b.dataset.index=i;document.querySelector('#chapters').append(b)});
function transcript(query=''){
const out=document.querySelector('#transcript');out.replaceChildren();
data.scenes.filter(s=>(s.title+' '+(s.narration||'')).toLocaleLowerCase().includes(query.toLocaleLowerCase())).forEach(s=>{
const b=button('',()=>jump(s.start));const title=document.createElement('strong');title.textContent=format(s.start)+' · '+s.title;const text=document.createElement('div');text.textContent=s.narration||'';b.append(title,text);out.append(b)});
if(!out.children.length){const p=document.createElement('p');p.textContent='לא נמצאו תוצאות';out.append(p)}
}transcript();
function checkpoint(scene){
seen.add(scene.id);video.pause();const q=scene.quiz;document.querySelector('#question').textContent=q.question;document.querySelector('#feedback').textContent='';document.querySelector('#resume').textContent='להמשיך בלי לענות';
const options=document.querySelector('#options');options.replaceChildren();q.options.forEach((o,i)=>options.append(button(o,()=>{const correct=i===q.correct;document.querySelector('#feedback').textContent=(correct?'נכון! ':'נסו שוב. ')+(q.explanation||'');if(correct)document.querySelector('#resume').textContent='ממשיכים'})));
quiz.showModal();
}
document.querySelector('#resume').onclick=()=>{quiz.close();video.play().catch(()=>{})};
document.querySelector('#reviewQuestion').onclick=()=>{const s=data.scenes[sceneIndex(video.currentTime)];if(s?.quiz)checkpoint(s)};
document.querySelector('#speed').onchange=e=>video.playbackRate=Number(e.target.value);
document.querySelector('#search').oninput=e=>transcript(e.target.value);
document.querySelector('#restart').onclick=()=>{seen.clear();jump(0);video.play().catch(()=>{})};
video.addEventListener('loadedmetadata',()=>{if(window.DAVINCI_MANAGED_PROGRESS)return;try{const t=Number(localStorage.getItem(storageKey)||0);if(t>0&&t<video.duration-2)jump(t)}catch{}});
video.addEventListener('seeking',()=>lastTime=video.currentTime);
video.addEventListener('timeupdate',()=>{
const t=video.currentTime,index=sceneIndex(t);
document.querySelectorAll('#chapters button').forEach((b,i)=>{b.classList.toggle('active',i===index);if(i===index)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')});
document.querySelector('#reviewQuestion').disabled=!data.scenes[index]?.quiz;
if(!window.DAVINCI_MANAGED_PROGRESS&&Math.abs(t-lastSaved)>2){try{localStorage.setItem(storageKey,String(t))}catch{}lastSaved=t}
if(document.querySelector('#checkpoints').checked&&!quiz.open&&t-lastTime<1.5){const crossed=data.scenes.find(s=>s.quiz&&!seen.has(s.id)&&s.start+s.duration-.15>lastTime&&s.start+s.duration-.15<=t);if(crossed)checkpoint(crossed)}lastTime=t;
});
addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON','TEXTAREA'].includes(e.target.tagName)||quiz.open)return;if(e.code==='Space'){e.preventDefault();video.paused?video.play().catch(()=>{}):video.pause()}if(e.key==='ArrowRight')jump(Math.min(video.duration||0,video.currentTime+5));if(e.key==='ArrowLeft')jump(Math.max(0,video.currentTime-5))});
</script>
